steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    script: |
      docker build --no-cache -t $_REGION-docker.pkg.dev/$PROJECT_ID/indexer/indexer:$TAG_NAME .
    automapSubstitutions: true

  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '$_REGION-docker.pkg.dev/$PROJECT_ID/indexer/indexer:$TAG_NAME']

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    script: |
      gcloud run deploy $_SERVICE_NAME --image $_REGION-docker.pkg.dev/$PROJECT_ID/indexer/indexer --region $_REGION --platform managed --allow-unauthenticated
    automapSubstitutions: true
