name: Check Source (Lint)
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Setup Node
        uses: actions/setup-node@v1
        with:
          node-version: 18.18.x
      - name: Lint Check
        run: yarn add -D eslint@^8.40.0 eslint-config-prettier@^4.2.1 eslint-plugin-prettier@^4.2.1 prettier@^2.8.8 @typescript-eslint/eslint-plugin@^5.59.5 @typescript-eslint/parser@^5.59.5 typescript-eslint@^8.19.0
      - name: Run ESLint
        run: yarn lint
