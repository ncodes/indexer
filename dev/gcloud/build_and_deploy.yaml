steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    script: |
      docker build -t $_REGION-docker.pkg.dev/$PROJECT_ID/indexer/indexer:$TAG_NAME .
    automapSubstitutions: true

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    script: |
      gcloud run deploy $_SERVICE_NAME --image $_REGION-docker.pkg.dev/quick-guru-354614/indexer/indexer --region $_REGION --platform managed --allow-unauthenticated
    automapSubstitutions: true

# Images to push
images:
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/indexer/indexer:$TAG_NAME'
