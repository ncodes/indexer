name: CI
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Setup Node
        uses: actions/setup-node@v1
        with:
          node-version: 17.2.0
      - name: Lint Check
        run: yarn
      - name: Run ESLint
        run: yarn lint
